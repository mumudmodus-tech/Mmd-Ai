<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mmd-Ai Studio Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Library html2pdf Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; }
    .prose-custom h1 { font-size: 1.5rem; font-weight: 700; color: #10b981; margin-top: 1rem; margin-bottom: 0.5rem; }
    .prose-custom h2 { font-size: 1.25rem; font-weight: 700; color: #38bdf8; margin-top: 1rem; margin-bottom: 0.5rem; }
    .prose-custom h3 { font-size: 1.1rem; font-weight: 600; color: #facc15; margin-top: 0.75rem; margin-bottom: 0.5rem; }
    .prose-custom p { margin-bottom: 0.75rem; line-height: 1.6; color: #e2e8f0; }
    .prose-custom hr { border-color: #334155; margin: 1.5rem 0; }
    .prose-custom strong { color: #ffffff; font-weight: 600; }
    .prose-custom ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.75rem; }
    .html2pdf__page-break { page-break-before: always; }
    .pdf-content h1, .pdf-content h2, .pdf-content h3 { page-break-after: avoid; }
    .pdf-content p, .pdf-content ul { page-break-inside: avoid; }
    .pdf-container { background: #ffffff; font-family: 'Georgia', serif; line-height: 1.8; color: #1e293b; position: relative; }
    .pdf-cover { min-height: 280mm; display: flex; flex-direction: column; justify-content: space-between; padding: 60px 40px; box-sizing: border-box; text-align: center; page-break-after: always; }
    .pdf-page-footer { margin-top: 40px; border-top: 1px solid #e2e8f0; padding-top: 12px; display: flex; justify-content: space-between; align-items: center; color: #94a3b8; font-size: 9px; }
    .theme-emerald .cover-accent { background-color: #10b981; color: #ffffff; }
    .theme-emerald h1 { color: #065f46; }
    .theme-emerald h2 { color: #047857; }
    .theme-navy .cover-accent { background-color: #1e3a8a; color: #ffffff; }
    .theme-navy h1 { color: #1e3a8a; }
    .theme-navy h2 { color: #1d4ed8; }
    .theme-minimal .cover-accent { background-color: #334155; color: #ffffff; }
    .theme-minimal h1 { color: #0f172a; }
    .theme-minimal h2 { color: #334155; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-3 sm:p-6">

  <!-- Header -->
  <div class="w-full max-w-xl text-center my-4">
    <h1 class="text-xl sm:text-3xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
      <span>✨</span> Mmd-Ai Studio <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/30 font-mono">PRO</span>
    </h1>
    <p class="text-xs sm:text-sm text-gray-400 mt-1">Professional E-Book & Affiliate Content Generator</p>
  </div>

  <!-- Main Container -->
  <div class="w-full max-w-xl bg-gray-900 border border-gray-800 rounded-2xl p-4 sm:p-5 shadow-2xl space-y-3.5">
    
    <!-- 1. API Key Section -->
    <div>
      <div class="flex justify-between items-center mb-1">
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">
          1. Gemini API Key
        </label>
        <button onclick="forceResetKey()" class="text-xs text-red-400 hover:underline">Reset Memori HP</button>
      </div>
      <input type="text" id="apiKey" placeholder="Tempel API Key Gemini Di Sini (AIzaSy...)" 
        class="w-full p-2.5 bg-gray-950 border border-gray-800 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500 transition">
    </div>

    <!-- 2. Profil Penulis & Link Toko -->
    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Nama Penulis</label>
        <input type="text" id="authorName" value="Pak Phow" 
          class="w-full p-2.5 bg-gray-950 border border-gray-800 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500 transition">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Link Jualan</label>
        <input type="text" id="authorLink" value="lynk.id/mmdpublishing" 
          class="w-full p-2.5 bg-gray-950 border border-gray-800 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500 transition">
      </div>
    </div>

    <!-- 3. AI Skill Selection -->
    <div>
      <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">
        3. Pilih AI Skill
      </label>
      <div class="grid grid-cols-2 gap-2">
        <button type="button" onclick="selectSkill('ebook', this)" id="btn-ebook" class="skill-btn p-2.5 bg-gray-950 border border-emerald-500 rounded-xl text-left transition">
          <div class="text-base">📘</div>
          <div class="font-semibold text-xs sm:text-sm text-white mt-0.5">E-Book</div>
          <div class="text-[10px] text-gray-400">Draf Bab & PDF</div>
        </button>
        <button type="button" onclick="selectSkill('sepatu', this)" id="btn-sepatu" class="skill-btn p-2.5 bg-gray-950 border border-gray-800 rounded-xl text-left transition">
          <div class="text-base">👟</div>
          <div class="font-semibold text-xs sm:text-sm text-white mt-0.5">Affiliate Sepatu</div>
          <div class="text-[10px] text-gray-400">Skrip VT + Hook</div>
        </button>
        <button type="button" onclick="selectSkill('skrip', this)" id="btn-skrip" class="skill-btn p-2.5 bg-gray-950 border border-gray-800 rounded-xl text-left transition">
          <div class="text-base">🎬</div>
          <div class="font-semibold text-xs sm:text-sm text-white mt-0.5">Skrip Iklan</div>
          <div class="text-[10px] text-gray-400">Konversi Tinggi</div>
        </button>
        <button type="button" onclick="selectSkill('medsos', this)" id="btn-medsos" class="skill-btn p-2.5 bg-gray-950 border border-gray-800 rounded-xl text-left transition">
          <div class="text-base">📱</div>
          <div class="font-semibold text-xs sm:text-sm text-white mt-0.5">Media Sosial</div>
          <div class="text-[10px] text-gray-400">Caption & Hashtag</div>
        </button>
      </div>
    </div>

    <!-- 4. Pengaturan Kedalaman & Tema -->
    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Kedalaman</label>
        <select id="contentDepth" class="w-full p-2.5 bg-gray-950 border border-gray-800 rounded-xl text-xs sm:text-sm text-white focus:outline-none focus:border-emerald-500 transition">
          <option value="standard">⚡ Standar (Cepat)</option>
          <option value="deep">🔥 Super Mendalam</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Tema PDF</label>
        <select id="pdfTheme" class="w-full p-2.5 bg-gray-950 border border-gray-800 rounded-xl text-xs sm:text-sm text-white focus:outline-none focus:border-emerald-500 transition">
          <option value="theme-emerald">🟢 Emerald Green</option>
          <option value="theme-navy">🔵 Classic Navy</option>
          <option value="theme-minimal">⚫ Minimalist Dark</option>
        </select>
      </div>
    </div>

    <!-- 5. Topic Input -->
    <div>
      <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">
        5. Tulis Judul / Ide Konten / Jenis Sepatu
      </label>
      <textarea id="userPrompt" rows="2" placeholder="Contoh: Rahasia Cuan Affiliate Sepatu Modal HP" 
        class="w-full p-2.5 bg-gray-950 border border-gray-800 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500 transition"></textarea>
    </div>

    <!-- Generate Button -->
    <div>
      <button id="generateBtn" onclick="generateContent()" 
        class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl shadow-lg transition flex items-center justify-center gap-2 cursor-pointer">
        <span>✨</span> Generate Konten & Layout Pro
      </button>
      
      <!-- Progress Bar -->
      <div id="progressContainer" class="hidden space-y-1 mt-2">
        <div class="w-full bg-gray-950 rounded-full h-2 overflow-hidden border border-gray-800">
          <div id="progressBar" class="bg-emerald-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
        <div id="progressStatus" class="text-xs text-emerald-400 text-center font-mono">Menyiapkan koneksi AI...</div>
      </div>
    </div>

  </div>

  <!-- Result Container -->
  <div class="w-full max-w-xl mt-4 mb-10">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-2">
      <div class="flex items-center gap-2">
        <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Hasil AI:</span>
        <div class="bg-gray-800 p-0.5 rounded-lg border border-gray-700 flex text-xs">
          <button onclick="switchView('preview')" id="viewPreviewBtn" class="px-2.5 py-1 rounded-md bg-emerald-600 text-white font-medium transition">Baca</button>
          <button onclick="switchView('markdown')" id="viewMarkdownBtn" class="px-2.5 py-1 rounded-md text-gray-400 hover:text-white transition">Markdown</button>
        </div>
      </div>
      
      <div class="flex items-center gap-2 flex-wrap">
        <span id="wordCountBadge" class="text-xs bg-gray-800 text-emerald-400 px-2.5 py-1 rounded-lg border border-gray-700 font-mono hidden">
          0 kata (~0 min)
        </span>
        <button onclick="copyResult()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1 rounded-lg border border-gray-700">
          📋 Salin
        </button>
        <button id="downloadPdfBtn" onclick="downloadPDF()" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1 rounded-lg font-medium hidden shadow">
          📥 Download PDF Pro
        </button>
      </div>
    </div>

    <!-- Result View Box -->
    <div id="resultBox" class="w-full min-h-[180px] p-4 bg-gray-900 border border-gray-800 rounded-xl text-sm prose-custom overflow-x-auto">
      <span class="text-gray-500">Hasil AI akan muncul di sini...</span>
    </div>
    <textarea id="rawMarkdownBox" class="w-full h-[250px] p-3 bg-gray-950 border border-gray-800 rounded-xl text-xs text-emerald-300 font-mono hidden focus:outline-none" readonly></textarea>

    <!-- Tombol Perpanjang -->
    <div id="expandActionBox" class="mt-3 hidden">
      <button onclick="expandContent()" id="expandBtn" class="w-full py-2.5 bg-gray-800 hover:bg-gray-700 text-emerald-400 border border-emerald-500/30 text-xs font-semibold rounded-xl transition flex items-center justify-center gap-2">
        <span>➕</span> Perpanjang & Tambah Detail Bab Pro
      </button>
    </div>
  </div>

  <script>
    let currentSkill = 'ebook';
    let rawTextResult = '';
    let currentView = 'preview';

    window.onload = function() {
      if (localStorage.getItem('gemini_api_key')) document.getElementById('apiKey').value = localStorage.getItem('gemini_api_key');
      if (localStorage.getItem('mmd_author_name')) document.getElementById('authorName').value = localStorage.getItem('mmd_author_name');
      if (localStorage.getItem('mmd_author_link')) document.getElementById('authorLink').value = localStorage.getItem('mmd_author_link');

      const savedDraft = localStorage.getItem('mmd_saved_draft');
      const savedPrompt = localStorage.getItem('mmd_saved_prompt');
      if (savedDraft) {
        rawTextResult = savedDraft;
        document.getElementById('resultBox').innerHTML = marked.parse(rawTextResult);
        document.getElementById('rawMarkdownBox').value = rawTextResult;
        if (savedPrompt) document.getElementById('userPrompt').value = savedPrompt;
        updateWordCount(rawTextResult);
        document.getElementById('downloadPdfBtn').classList.remove('hidden');
        document.getElementById('expandActionBox').classList.remove('hidden');
      }
    };

    function forceResetKey() {
      localStorage.clear();
      document.getElementById('apiKey').value = '';
      document.getElementById('authorName').value = 'Pak Phow';
      document.getElementById('authorLink').value = 'lynk.id/mmdpublishing';
      document.getElementById('resultBox').innerHTML = "<span class='text-gray-500'>Hasil AI akan muncul di sini...</span>";
      document.getElementById('rawMarkdownBox').value = '';
      document.getElementById('downloadPdfBtn').classList.add('hidden');
      document.getElementById('expandActionBox').classList.add('hidden');
      document.getElementById('wordCountBadge').classList.add('hidden');
      alert('Memori HP berhasil dibersihkan!');
    }

    function selectSkill(skill, element) {
      currentSkill = skill;
      document.querySelectorAll('.skill-btn').forEach(btn => {
        btn.classList.remove('border-emerald-500');
        btn.classList.add('border-gray-800');
      });
      element.classList.remove('border-gray-800');
      element.classList.add('border-emerald-500');
    }

    function switchView(view) {
      currentView = view;
      const resBox = document.getElementById('resultBox');
      const rawBox = document.getElementById('rawMarkdownBox');
      const btnPrev = document.getElementById('viewPreviewBtn');
      const btnMark = document.getElementById('viewMarkdownBtn');

      if (view === 'preview') {
        resBox.classList.remove('hidden');
        rawBox.classList.add('hidden');
        btnPrev.className = "px-2.5 py-1 rounded-md bg-emerald-600 text-white font-medium transition";
        btnMark.className = "px-2.5 py-1 rounded-md text-gray-400 hover:text-white transition";
      } else {
        resBox.classList.add('hidden');
        rawBox.classList.remove('hidden');
        rawBox.value = rawTextResult;
        btnMark.className = "px-2.5 py-1 rounded-md bg-emerald-600 text-white font-medium transition";
        btnPrev.className = "px-2.5 py-1 rounded-md text-gray-400 hover:text-white transition";
      }
    }

    function updateWordCount(text) {
      const words = text.trim().split(/\s+/).filter(Boolean).length;
      const readTime = Math.max(1, Math.ceil(words / 200));
      const badge = document.getElementById('wordCountBadge');
      badge.innerText = `📊 ${words} Kata (~${readTime} min)`;
      badge.classList.remove('hidden');
    }

    function saveDraftToLocal(text, prompt) {
      localStorage.setItem('mmd_saved_draft', text);
      localStorage.setItem('mmd_saved_prompt', prompt);
      localStorage.setItem('mmd_author_name', document.getElementById('authorName').value.trim());

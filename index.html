<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mmd-Ai Studio - Ebook Generator Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Library html2pdf Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; }
    
    /* Styling Tampilan Web */
    .prose-custom h1 { font-size: 1.5rem; font-weight: 700; color: #10b981; margin-top: 1rem; margin-bottom: 0.5rem; }
    .prose-custom h2 { font-size: 1.25rem; font-weight: 700; color: #38bdf8; margin-top: 1rem; margin-bottom: 0.5rem; }
    .prose-custom h3 { font-size: 1.1rem; font-weight: 600; color: #facc15; margin-top: 0.75rem; margin-bottom: 0.5rem; }
    .prose-custom p { margin-bottom: 0.75rem; line-height: 1.6; color: #e2e8f0; }
    .prose-custom hr { border-color: #334155; margin: 1.5rem 0; }
    .prose-custom strong { color: #ffffff; font-weight: 600; }
    .prose-custom ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.75rem; }

    /* Aturan Anti-Terpotong Canggung untuk PDF */
    .html2pdf__page-break { page-break-before: always; }
    .pdf-content h1, .pdf-content h2, .pdf-content h3 { page-break-after: avoid; }
    .pdf-content p, .pdf-content ul { page-break-inside: avoid; }

    /* Template PDF Base */
    .pdf-container { background: #ffffff; font-family: 'Georgia', serif; line-height: 1.8; color: #1e293b; }

    /* Cover Page Styling */
    .pdf-cover {
      min-height: 280mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px 40px;
      box-sizing: border-box;
      text-align: center;
      page-break-after: always;
    }

    /* Tema Warna PDF */
    .theme-emerald .cover-accent { background-color: #10b981; color: #ffffff; }
    .theme-emerald h1 { color: #065f46; }
    .theme-emerald h2 { color: #047857; }

    .theme-navy .cover-accent { background-color: #1e3a8a; color: #ffffff; }
    .theme-navy h1 { color: #1e3a8a; }
    .theme-navy h2 { color: #1d4ed8; }

    .theme-minimal .cover-accent { background-color: #334155; color: #ffffff; }
    .theme-minimal h1 { color: #0f172a; }
    .theme-minimal h2 { color: #334155; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 sm:p-6">

  <!-- Header -->
  <div class="w-full max-w-xl text-center my-6">
    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
      <span>✨</span> Mmd-Ai Studio
    </h1>
    <p class="text-sm text-gray-400 mt-2">Buat E-Book & Konten Digital Berformat PDF Siap Jual.</p>
  </div>

  <!-- Main Container -->
  <div class="w-full max-w-xl bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-2xl space-y-5">
    
    <!-- 1. API Key Section -->
    <div>
      <div class="flex justify-between items-center mb-2">
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">
          1. Gemini API Key
        </label>
        <button id="resetMemBtn" onclick="forceResetKey()" class="text-xs text-red-400 hover:underline">Reset Memori HP</button>
      </div>
      <input type="text" id="apiKey" placeholder="Tempel API Key Gemini Di Sini (AIzaSy...)" 
        class="w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500 transition">
    </div>

    <!-- 2. Profil Penulis & Link Brand -->
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Nama Penulis</label>
        <input type="text" id="authorName" placeholder="Contoh: Mas Mahmud / Pak Phow" value="Pak Phow" 
          class="w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500 transition">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Link Jualan / Lynk.id</label>
        <input type="text" id="authorLink" placeholder="lynk.id/namatoko" value="lynk.id/mmd-ai" 
          class="w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500 transition">
      </div>
    </div>

    <!-- 3. AI Skill Selection -->
    <div>
      <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">
        3. Pilih AI Skill
      </label>
      <div class="grid grid-cols-2 gap-3">
        <button type="button" onclick="selectSkill('ebook', this)" class="skill-btn p-3 bg-gray-950 border border-emerald-500/50 rounded-xl text-left hover:border-emerald-500 transition active">
          <div class="text-lg">📘</div>
          <div class="font-semibold text-sm text-white mt-1">E-Book</div>
          <div class="text-xs text-gray-400">Lengkap dengan Cover & Bab</div>
        </button>
        <button type="button" onclick="selectSkill('skrip', this)" class="skill-btn p-3 bg-gray-950 border border-gray-800 rounded-xl text-left hover:border-emerald-500 transition">
          <div class="text-lg">🎬</div>
          <div class="font-semibold text-sm text-white mt-1">Skrip Iklan</div>
          <div class="text-xs text-gray-400">Hook & Konversi Tinggi</div>
        </button>
        <button type="button" onclick="selectSkill('medsos', this)" class="skill-btn p-3 bg-gray-950 border border-gray-800 rounded-xl text-left hover:border-emerald-500 transition">
          <div class="text-lg">📱</div>
          <div class="font-semibold text-sm text-white mt-1">Media Sosial</div>
          <div class="text-xs text-gray-400">Konsep Siap Posting</div>
        </button>
        <button type="button" onclick="selectSkill('email', this)" class="skill-btn p-3 bg-gray-950 border border-gray-800 rounded-xl text-left hover:border-emerald-500 transition">
          <div class="text-lg">✉️</div>
          <div class="font-semibold text-sm text-white mt-1">Konten Email</div>
          <div class="text-xs text-gray-400">Email Marketing Penjualan</div>
        </button>
      </div>
    </div>

    <!-- 4. Pilihan Tema Warna PDF -->
    <div>
      <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">
        4. Tema Warna PDF E-Book
      </label>
      <select id="pdfTheme" class="w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500 transition">
        <option value="theme-emerald">🟢 Emerald Green (Bisnis & Keuangan)</option>
        <option value="theme-navy">🔵 Classic Navy (Edukasi & Profesional)</option>
        <option value="theme-minimal">⚫ Minimalist Dark (Elegan & Modern)</option>
      </select>
    </div>

    <!-- 5. Topic Input -->
    <div>
      <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">
        5. Tulis Judul / Ide Konten
      </label>
      <textarea id="userPrompt" rows="3" placeholder="Contoh: Trik Dapat Sehari Minimal 200 Ribu Dari HP" 
        class="w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500 transition"></textarea>
    </div>

    <!-- Generate Button -->
    <button id="generateBtn" onclick="generateContent()" 
      class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl shadow-lg transition flex items-center justify-center gap-2">
      <span>✨</span> Generate Konten & Layout E-Book
    </button>

  </div>

  <!-- Result Container -->
  <div class="w-full max-w-xl mt-6">
    <!-- Stat Bar & Actions -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-2">
      <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Hasil AI & Layout:</span>
      
      <div class="flex items-center gap-2 flex-wrap">
        <span id="wordCountBadge" class="text-xs bg-gray-800 text-emerald-400 px-2.5 py-1 rounded-lg border border-gray-700 font-mono hidden">
          0 kata (~0 min)
        </span>
        <button onclick="copyResult()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1 rounded-lg border border-gray-700">
          📋 Salin
        </button>
        <button id="downloadPdf

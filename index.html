<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Generator - Edukazo Style</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 sm:p-6">

    <!-- Header -->
    <div class="w-full max-w-xl text-center mb-6 mt-4">
        <h1 class="text-2xl font-bold tracking-tight text-white">✨ AI Content Generator</h1>
        <p class="text-sm text-gray-400 mt-1">Bikin e-book, skrip, & konten instan rasa ketikan manusia.</p>
    </div>

    <!-- Main Container -->
    <div class="w-full max-w-xl bg-[#131b2e] border border-gray-800 rounded-2xl p-5 shadow-xl">
        
        <!-- STEP 1: Masukkan API Key -->
        <div class="mb-4">
            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">1. Masukkan API Key Gemini Anda</label>
            <input type="password" id="apiKey" placeholder="Tempel API Key di sini..." class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>

        <!-- STEP 2: Pilih Kategori Skill -->
        <div class="mb-4">
            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">2. Pilih AI Skill</label>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5" id="skillGrid">
                <!-- Skill Options -->
                <div onclick="selectSkill('E-Book', 'Buatkan struktur bab terstruktur dan isi draf e-book yang mendalam, mengalir, dan bernuansa manusia berdasarkan ide berikut:')" class="skill-card cursor-pointer border border-gray-800 bg-[#1a233a] hover:border-emerald-500 p-3 rounded-xl transition-all flex items-center space-x-3 active:scale-98">
                    <span class="text-xl">📘</span>
                    <div>
                        <div class="text-sm font-semibold text-white">E-Book</div>
                        <div class="text-xs text-gray-400">Bab terstruktur & mendalam</div>
                    </div>
                </div>

                <div onclick="selectSkill('Skrip Iklan', 'Buatkan skrip iklan atau affiliate dengan hook tajam, bahasa persuasif, dan call-to-action kuat berdasarkan ide berikut:')" class="skill-card cursor-pointer border border-gray-800 bg-[#1a233a] hover:border-emerald-500 p-3 rounded-xl transition-all flex items-center space-x-3 active:scale-98">
                    <span class="text-xl">🎬</span>
                    <div>
                        <div class="text-sm font-semibold text-white">Skrip Iklan / Affiliate</div>
                        <div class="text-xs text-gray-400">Hook tajam & konversi tinggi</div>
                    </div>
                </div>

                <div onclick="selectSkill('Media Sosial', 'Buatkan konsep konten media sosial (TikTok/Instagram) siap posting yang interaktif dan menarik berdasarkan ide berikut:')" class="skill-card cursor-pointer border border-gray-800 bg-[#1a233a] hover:border-emerald-500 p-3 rounded-xl transition-all flex items-center space-x-3 active:scale-98">
                    <span class="text-xl">📱</span>
                    <div>
                        <div class="text-sm font-semibold text-white">Media Sosial</div>
                        <div class="text-xs text-gray-400">Konsep siap posting</div>
                    </div>
                </div>

                <div onclick="selectSkill('Konten Email', 'Buatkan draf konten email marketing yang kasual, terpercaya, dan mendatangkan konversi tinggi berdasarkan ide berikut:')" class="skill-card cursor-pointer border border-gray-800 bg-[#1a233a] hover:border-emerald-500 p-3 rounded-xl transition-all flex items-center space-x-3 active:scale-98">
                    <span class="text-xl">✉️</span>
                    <div>
                        <div class="text-sm font-semibold text-white">Konten Email</div>
                        <div class="text-xs text-gray-400">Email bernilai konversi</div>
                    </div>
                </div>
            </div>
            <input type="hidden" id="selectedSkillName" value="">
            <input type="hidden" id="selectedSkillPrompt" value="">
        </div>

        <!-- STEP 3: Input Ide -->
        <div class="mb-4">
            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">3. Tulis Ide Simpel Anda</label>
            <textarea id="userIdea" rows="3" placeholder="Misal: Cara cari penghasilan tambahan pakai HP untuk pemula..." class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500"></textarea>
        </div>

        <!-- Generate Button -->
        <button onclick="generateContent()" id="genBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition-all shadow-lg text-sm cursor-pointer">
            ✨ Generate Konten Sekarang
        </button>
    </div>

    <!-- Output Section -->
    <div id="outputContainer" class="w-full max-w-xl mt-6 hidden">
        <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Hasil AI:</span>
            <button onclick="copyResult()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg border border-gray-700 transition">📋 Salin Teks</button>
        </div>
        <div id="resultBox" class="w-full bg-[#131b2e] border border-gray-800 rounded-2xl p-4 text-sm text-gray-200 whitespace-pre-wrap leading-relaxed shadow-xl"></div>
    </div>

    <!-- Script Koneksi Gemini API -->
    <script>
        let currentSkillTitle = '';
        let currentSystemPrompt = '';

        function selectSkill(skillName, promptText) {
            currentSkillTitle = skillName;
            currentSystemPrompt = promptText;
            
            // Highlight selected card effect
            document.querySelectorAll('.skill-card').forEach(card => {
                card.classList.remove('border-emerald-500', 'bg-[#202d4a]');
            });
            event.currentTarget.classList.add('border-emerald-500', 'bg-[#202d4a]');
        }

        async function generateContent() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const userIdea = document.getElementById('userIdea').value.trim();
            const btn = document.getElementById('genBtn');
            const outputContainer = document.getElementById('outputContainer');
            const resultBox = document.getElementById('resultBox');

            if (!apiKey) {
                alert('Silakan masukkan API Key Gemini Anda terlebih dahulu!');
                return;
            }
            if (!currentSkillTitle) {
                alert('Silakan pilih salah satu AI Skill terlebih dahulu!');
                return;
            }
            if (!userIdea) {
                alert('Tulis ide simpel Anda di kolom yang tersedia!');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Sedang Meracik Tulisan... ⏳';
            outputContainer.classList.remove('hidden');
            resultBox.innerText = 'AI sedang menulis dengan gaya bahasa alami... Mohon tunggu sebentar.';

            const fullPrompt = `${currentSystemPrompt}\n\nIde Pengguna: "${userIdea}"\n\nCatatan Penting: Gunakan bahasa Indonesia yang natural, kasual, mengalir seperti ketikan manusia profesional, dan hindari gaya bahasa robotik baku yang kaku.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: fullPrompt }] }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    resultBox.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    resultBox.innerText = 'Terjadi kesalahan: Respon AI tidak valid. Periksa kembali API Key Anda.';
                }
            } catch (error) {
                resultBox.innerText = 'Gagal terhubung ke server AI: ' + error.message;
            } finally {
                btn.disabled = false;
                btn.innerText = '✨ Generate Konten Kembali';
            }
        }

        function copyResult() {
            const text = document.getElementById('resultBox').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert('Hasil berhasil disalin ke clipboard!');
            });
        }
    </script>
</body>
</html>

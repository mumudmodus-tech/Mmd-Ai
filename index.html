<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mmd-Ai Studio - Ebook Generator Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Library html2pdf Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; }
    
    /* Styling Tampilan Web */
    .prose-custom h1 { font-size: 1.5rem; font-weight: 700; color: #10b981; margin-top: 1rem; margin-bottom: 0.5rem; }
    .prose-custom h2 { font-size: 1.25rem; font-weight: 700; color: #38bdf8; margin-top: 1rem; margin-bottom: 0.5rem; }
    .prose-custom h3 { font-size: 1.1rem; font-weight: 600; color: #facc15; margin-top: 0.75rem; margin-bottom: 0.5rem; }
    .prose-custom p { margin-bottom: 0.75rem; line-height: 1.6; color: #e2e8f0; }
    .prose-custom hr { border-color: #334155; margin: 1.5rem 0; }
    .prose-custom strong { color: #ffffff; font-weight: 600; }
    .prose-custom ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.75rem; }

    /* Aturan Anti-Terpotong Canggung untuk PDF */
    .html2pdf__page-break {
      page-break-before: always;
    }
    .pdf-content h1, .pdf-content h2, .pdf-content h3 {
      page-break-after: avoid;
    }
    .pdf-content p, .pdf-content ul {
      page-break-inside: avoid;
    }

    /* Template PDF Base */
    .pdf-container {
      background: #ffffff;
      font-family: 'Georgia', serif;
      line-height: 1.8;
      color: #1e293b;
    }

    /* Cover Page Styling */
    .pdf-cover {
      min-height: 280mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px 40px;
      box-sizing: border-box;
      text-align: center;
      page-break-after: always;
    }

    /* Tema Warna PDF */
    .theme-emerald .cover-accent { background-color: #10b981; color: #ffffff; }
    .theme-emerald h1 { color: #065f46; }
    .theme-emerald h2 { color: #047857; }

    .theme-navy .cover-accent { background-color: #1e3a8a; color: #ffffff; }
    .theme-navy h1 { color: #1e3a8a; }
    .theme-navy h2 { color: #1d4ed8; }

    .theme-minimal .cover-accent { background-color: #334155; color: #ffffff; }
    .theme-minimal h1 { color: #0f172a; }
    .theme-minimal h2 { color: #334155; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 sm:p-6">

  <!-- Header -->
  <div class="w-full max-w-xl text-center my-6">
    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
      <span>✨</span> Mmd-Ai Studio
    </h1>
    <p class="text-sm text-gray-400 mt-2">Buat E-Book & Konten Digital Berformat PDF Siap Jual.</p>
  </div>

  <!-- Main Container -->
  <div class="w-full max-w-xl bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-2xl space-y-5">
    
    <!-- 1. API Key Section -->
    <div>
      <div class="flex justify-between items-center mb-2">
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">
          1. Gemini API Key
        </label>
        <button id="resetMemBtn" onclick="forceResetKey()" class="text-xs text-red-400 hover:underline">Reset Memori HP</button>
      </div>
      <input type="text" id="apiKey" placeholder="Tempel API Key Gemini Di Sini (AIzaSy...)" 
        class="w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500 transition">
    </div>

    <!-- 2. AI Skill Selection -->
    <div>
      <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">
        2. Pilih AI Skill
      </label>
      <div class="grid grid-cols-2 gap-3">
        <button type="button" onclick="selectSkill('ebook', this)" class="skill-btn p-3 bg-gray-950 border border-emerald-500/50 rounded-xl text-left hover:border-emerald-500 transition active">
          <div class="text-lg">📘</div>
          <div class="font-semibold text-sm text-white mt-1">E-Book</div>
          <div class="text-xs text-gray-400">Lengkap dengan Cover & Bab</div>
        </button>
        <button type="button" onclick="selectSkill('skrip', this)" class="skill-btn p-3 bg-gray-950 border border-gray-800 rounded-xl text-left hover:border-emerald-500 transition">
          <div class="text-lg">🎬</div>
          <div class="font-semibold text-sm text-white mt-1">Skrip Iklan</div>
          <div class="text-xs text-gray-400">Hook & Konversi Tinggi</div>
        </button>
        <button type="button" onclick="selectSkill('medsos', this)" class="skill-btn p-3 bg-gray-950 border border-gray-800 rounded-xl text-left hover:border-emerald-500 transition">
          <div class="text-lg">📱</div>
          <div class="font-semibold text-sm text-white mt-1">Media Sosial</div>
          <div class="text-xs text-gray-400">Konsep Siap Posting</div>
        </button>
        <button type="button" onclick="selectSkill('email', this)" class="skill-btn p-3 bg-gray-950 border border-gray-800 rounded-xl text-left hover:border-emerald-500 transition">
          <div class="text-lg">✉️</div>
          <div class="font-semibold text-sm text-white mt-1">Konten Email</div>
          <div class="text-xs text-gray-400">Email Marketing Penjualan</div>
        </button>
      </div>
    </div>

    <!-- 3. Pilihan Tema Warna PDF -->
    <div>
      <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">
        3. Tema Warna PDF E-Book
      </label>
      <select id="pdfTheme" class="w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500 transition">
        <option value="theme-emerald">🟢 Emerald Green (Bisnis & Keuangan)</option>
        <option value="theme-navy">🔵 Classic Navy (Edukasi & Profesional)</option>
        <option value="theme-minimal">⚫ Minimalist Dark (Elegan & Modern)</option>
      </select>
    </div>

    <!-- 4. Topic Input -->
    <div>
      <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">
        4. Tulis Judul / Ide Konten
      </label>
      <textarea id="userPrompt" rows="3" placeholder="Contoh: Trik Dapat Sehari Minimal 200 Ribu Dari HP" 
        class="w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500 transition"></textarea>
    </div>

    <!-- Generate Button -->
    <button id="generateBtn" onclick="generateContent()" 
      class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl shadow-lg transition flex items-center justify-center gap-2">
      <span>✨</span> Generate Konten & Layout E-Book
    </button>

  </div>

  <!-- Result Container -->
  <div class="w-full max-w-xl mt-6">
    <div class="flex justify-between items-center mb-2">
      <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Hasil AI & Layout:</span>
      <div class="flex gap-2">
        <button onclick="copyResult()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1 rounded-lg border border-gray-700 flex items-center gap-1">
          📋 Salin
        </button>
        <button id="downloadPdfBtn" onclick="downloadPDF()" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1 rounded-lg font-medium hidden flex items-center gap-1 shadow">
          📥 Download PDF
        </button>
      </div>
    </div>

    <div id="resultBox" class="w-full min-h-[180px] p-5 bg-gray-900 border border-gray-800 rounded-xl text-sm prose-custom overflow-x-auto">
      <span class="text-gray-500">Hasil AI akan muncul di sini...</span>
    </div>
  </div>

  <script>
    let currentSkill = 'ebook';
    let rawTextResult = '';

    window.onload = function() {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
      }
    };

    function forceResetKey() {
      localStorage.clear();
      document.getElementById('apiKey').value = '';
      alert('Memori kunci dihapus total!');
    }

    function selectSkill(skill, element) {
      currentSkill = skill;
      document.querySelectorAll('.skill-btn').forEach(btn => {
        btn.classList.remove('border-emerald-500');
        btn.classList.add('border-gray-800');
      });
      element.classList.remove('border-gray-800');
      element.classList.add('border-emerald-500');
    }

    async function generateContent() {
      const apiKeyInput = document.getElementById('apiKey').value.trim();
      const userPrompt = document.getElementById('userPrompt').value.trim();
      const resultBox = document.getElementById('resultBox');
      const btn = document.getElementById('generateBtn');
      const downloadBtn = document.getElementById('downloadPdfBtn');

      if (!apiKeyInput) { alert('Masukkan API Key!'); return; }
      if (!userPrompt) { alert('Masukkan ide konten!'); return; }

      localStorage.setItem('gemini_api_key', apiKeyInput);

      btn.disabled = true;
      btn.innerText = "⚡ Menyusun Bab & Layout...";
      resultBox.innerHTML = "<span class='text-gray-400'>Sedang merancang e-book profesional...</span>";
      downloadBtn.classList.add('hidden');

      let systemInstruction = "";
      if (currentSkill === 'ebook') {
        systemInstruction = "Bertindaklah sebagai penulis e-book profesional. Buat draf e-book lengkap dengan Judul Utama, Kata Pengantar, dan Bab-bab terstruktur. Gunakan format Markdown (# untuk Judul Utama, ## untuk Sub-judul, ### untuk Topik, dan ** kata tebal).";
      } else if (currentSkill === 'skrip') {
        systemInstruction = "Bertindaklah sebagai spesialis copywriting iklan video. Buat skrip iklan berformat rapi dengan Judul, Hook 3 Detik, Isi, dan Call to Action. Gunakan format Markdown.";
      } else if (currentSkill === 'medsos') {
        systemInstruction = "Bertindaklah sebagai Social Media Strategist. Buat konsep konten media sosial siap posting lengkap dengan Headline, Isi Pesan, dan Hashtag. Gunakan format Markdown.";
      } else {
        systemInstruction = "Bertindaklah sebagai Email Marketer berpengalaman. Buat email promosi dengan Subject Line, Salam, Isi, dan CTA. Gunakan format Markdown.";
      }

      const fullPrompt = `${systemInstruction}\n\nTopik/Ide: ${userPrompt}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKeyInput}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: fullPrompt }] }] })
        });

        const data = await response.json();

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          rawTextResult = data.candidates[0].content.parts[0].text;
          resultBox.innerHTML = marked.parse(rawTextResult);
          downloadBtn.classList.remove('hidden');
        } else if (data.error) {
          resultBox.innerHTML = `<span class="text-red-400">Terjadi kesalahan API: ${data.error.message}</span>`;
        }
      } catch (err) {
        resultBox.innerHTML = "<span class='text-red-400'>Gagal terhubung ke server.</span>";
      } finally {
        btn.disabled = false;
        btn.innerHTML = "<span>✨</span> Generate Konten & Layout E-Book";
      }
    }

    function downloadPDF() {
      if (!rawTextResult) return;

      const selectedTheme = document.getElementById('pdfTheme').value;
      const userPrompt = document.getElementById('userPrompt').value.trim() || "E-Book Panduan Digital";

      const element = document.createElement('div');
      element.className = `pdf-container ${selectedTheme}`;
      
      const parsedBody = marked.parse(rawTextResult);

      // Susun Struktur PDF: Cover Page + Isi Konten
      element.innerHTML = `
        <!-- HALAMAN 1: COVER E-BOOK AUTOMATIS -->
        <div class="pdf-cover">
          <div style="border-top: 4px solid currentColor; padding-top: 20px;">
            <span class="cover-accent" style="padding: 6px 16px; border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1.5px;">E-Book Spesial</span>
          </div>
          
          <div style="margin: 40px 0;">
            <h1 style="font-size: 28px; font-weight: bold; line-height: 1.3; margin-bottom: 15px;">${userPrompt}</h1>
            <p style="font-size: 14px; color: #64748b; font-style: italic;">Panduan Praktis & Langkah Aplikasi Lapangan</p>
          </div>

          <div style="border-bottom: 1px solid #e2e8f0; padding-bottom: 20px;">
            <p style="font-size: 11px; color: #94a3b8; margin: 0;">Diterbitkan Oleh:</p>
            <p style="font-size: 13px; font-weight: bold; color: #334155; margin-top: 2px;">Pak Phow • Mmd-Ai Studio</p>
          </div>
        </div>

        <!-- HALAMAN 2 DST: ISI KONTEN -->
        <div class="pdf-content" style="padding: 40px;">
          ${parsedBody}
          
          <div style="margin-top: 50px; border-top: 1px solid #e2e8f0; padding-top: 15px; text-align: center; color: #94a3b8; font-size: 10px;">
            © Hak Cipta Dilindungi • Siap Dipasarkan via Lynk.id
          </div>
        </div>
      `;

      const options = {
        margin:       0,
        filename:     `Ebook-${userPrompt.substring(0, 20).replace(/\s+/g, '-')}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
      };

      html2pdf().from(element).set(options).save();
    }

    function copyResult() {
      if (rawTextResult) {
        navigator.clipboard.writeText(rawTextResult);
        alert('Teks berhasil disalin!');
      }
    }
  </script>
</body>
</html>

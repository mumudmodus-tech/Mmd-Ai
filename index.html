<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Generator - Edukazo Style</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 sm:p-6">

  <!-- Header -->
  <div class="w-full max-w-xl text-center my-6">
    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
      <span>✨</span> AI Content Generator
    </h1>
    <p class="text-sm text-gray-400 mt-2">Bikin e-book, skrip, & konten instan rasa ketikan manusia.</p>
  </div>

  <!-- Main Container -->
  <div class="w-full max-w-xl bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-2xl space-y-5">
    
    <!-- 1. API Key Section -->
    <div>
      <div class="flex justify-between items-center mb-2">
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">
          1. Masukkan API Key Gemini Anda
        </label>
        <button id="clearKeyBtn" onclick="clearApiKey()" class="text-xs text-red-400 hover:underline hidden">Hapus Key</button>
      </div>
      <input type="password" id="apiKey" placeholder="AIzaSy..." 
        class="w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500 transition"
        oninput="saveApiKey()">
      <p id="keyStatus" class="text-xs text-emerald-400 mt-1 hidden">✓ API Key tersimpan di HP ini</p>
    </div>

    <!-- 2. AI Skill Selection -->
    <div>
      <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">
        2. Pilih AI Skill
      </label>
      <div class="grid grid-cols-2 gap-3">
        <button type="button" onclick="selectSkill('ebook', this)" class="skill-btn p-3 bg-gray-950 border border-emerald-500/50 rounded-xl text-left hover:border-emerald-500 transition active">
          <div class="text-lg">📘</div>
          <div class="font-semibold text-sm text-white mt-1">E-Book</div>
          <div class="text-xs text-gray-400">Bab terstruktur & mendalam</div>
        </button>
        <button type="button" onclick="selectSkill('skrip', this)" class="skill-btn p-3 bg-gray-950 border border-gray-800 rounded-xl text-left hover:border-emerald-500 transition">
          <div class="text-lg">🎬</div>
          <div class="font-semibold text-sm text-white mt-1">Skrip Iklan / Affiliate</div>
          <div class="text-xs text-gray-400">Hook tajam & konversi tinggi</div>
        </button>
        <button type="button" onclick="selectSkill('medsos', this)" class="skill-btn p-3 bg-gray-950 border border-gray-800 rounded-xl text-left hover:border-emerald-500 transition">
          <div class="text-lg">📱</div>
          <div class="font-semibold text-sm text-white mt-1">Media Sosial</div>
          <div class="text-xs text-gray-400">Konsep siap posting</div>
        </button>
        <button type="button" onclick="selectSkill('email', this)" class="skill-btn p-3 bg-gray-950 border border-gray-800 rounded-xl text-left hover:border-emerald-500 transition">
          <div class="text-lg">✉️</div>
          <div class="font-semibold text-sm text-white mt-1">Konten Email</div>
          <div class="text-xs text-gray-400">Email bernilai konversi</div>
        </button>
      </div>
    </div>

    <!-- 3. Topic Input -->
    <div>
      <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">
        3. Tulis Ide Simpel Anda
      </label>
      <textarea id="userPrompt" rows="3" placeholder="Contoh: Cara menghasilkan duit dari hp bagi pemula" 
        class="w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500 transition"></textarea>
    </div>

    <!-- Generate Button -->
    <button id="generateBtn" onclick="generateContent()" 
      class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl shadow-lg transition flex items-center justify-center gap-2">
      <span>✨</span> Generate Konten
    </button>

  </div>

  <!-- Result Container -->
  <div class="w-full max-w-xl mt-6">
    <div class="flex justify-between items-center mb-2">
      <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Hasil AI:</span>
      <button onclick="copyResult()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1 rounded-lg border border-gray-700 flex items-center gap-1">
        📋 Salin Teks
      </button>
    </div>
    <div id="resultBox" class="w-full min-h-[150px] p-4 bg-gray-900 border border-gray-800 rounded-xl text-sm text-gray-200 whitespace-pre-wrap">
      Hasil AI akan muncul di sini...
    </div>
  </div>

  <script>
    let currentSkill = 'ebook';

    window.onload = function() {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
        document.getElementById('keyStatus').classList.remove('hidden');
        document.getElementById('clearKeyBtn').classList.remove('hidden');
      }
    };

    function saveApiKey() {
      const key = document.getElementById('apiKey').value.trim();
      if (key) {
        localStorage.setItem('gemini_api_key', key);
        document.getElementById('keyStatus').classList.remove('hidden');
        document.getElementById('clearKeyBtn').classList.remove('hidden');
      } else {
        clearApiKey();
      }
    }

    function clearApiKey() {
      localStorage.removeItem('gemini_api_key');
      document.getElementById('apiKey').value = '';
      document.getElementById('keyStatus').classList.add('hidden');
      document.getElementById('clearKeyBtn').classList.add('hidden');
    }

    function selectSkill(skill, element) {
      currentSkill = skill;
      document.querySelectorAll('.skill-btn').forEach(btn => {
        btn.classList.remove('border-emerald-500');
        btn.classList.add('border-gray-800');
      });
      element.classList.remove('border-gray-800');
      element.classList.add('border-emerald-500');
    }

    async function generateContent() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const userPrompt = document.getElementById('userPrompt').value.trim();
      const resultBox = document.getElementById('resultBox');
      const btn = document.getElementById('generateBtn');

      if (!apiKey) {
        alert('Mohon masukkan Gemini API Key Anda!');
        return;
      }
      if (!userPrompt) {
        alert('Mohon masukkan ide konten Anda!');
        return;
      }

      btn.disabled = true;
      btn.innerText = "⚡ Memproses Konten...";
      resultBox.innerText = "Sedang berfikir & menyusun konten terbaik...";

      let systemInstruction = "";
      if (currentSkill === 'ebook') {
        systemInstruction = "Bertindaklah sebagai penulis e-book profesional. Buat draf bab e-book yang terstruktur, mendalam, praktis, dan mudah dipahami dalam bahasa Indonesia dengan nada edukatif.";
      } else if (currentSkill === 'skrip') {
        systemInstruction = "Bertindaklah sebagai spesialis copywriting iklan video. Buat skrip iklan/affiliate yang memiliki Hook menarik di 3 detik pertama, isi yang relevan, dan Call to Action (CTA) yang kuat.";
      } else if (currentSkill === 'medsos') {
        systemInstruction = "Bertindaklah sebagai Social Media Strategist. Buat konsep konten media sosial lengkap dengan Headline, Isi Pesan, dan Rekomendasi Caption + Hashtag.";
      } else {
        systemInstruction = "Bertindaklah sebagai Email Marketer berpengalaman. Buat email promosi dengan Subject Line yang memancing rasa penasaran dan isi email yang membangun kepercayaan serta konversi.";
      }

      const fullPrompt = `${systemInstruction}\n\nTopik/Ide: ${userPrompt}`;

      try {
        // Menggunakan model gemini-1.5-flash dengan jalur v1beta yang kompatibel
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: fullPrompt }] }]
          })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          resultBox.innerText = data.candidates[0].content.parts[0].text;
        } else if (data.error) {
          resultBox.innerText = `Terjadi kesalahan API: ${data.error.message || 'API Key tidak valid'}`;
        } else {
          resultBox.innerText = "Terjadi kesalahan: Respon AI tidak valid. Periksa kembali API Key Anda.";
        }
      } catch (err) {
        resultBox.innerText = "Gagal terhubung ke jaringan. Periksa koneksi internet Anda.";
      } finally {
        btn.disabled = false;
        btn.innerHTML = "<span>✨</span> Generate Konten Kembali";
      }
    }

    function copyResult() {
      const text = document.getElementById('resultBox').innerText;
      if (text && !text.startsWith('Hasil AI akan') && !text.startsWith('Sedang berfikir')) {
        navigator.clipboard.writeText(text);
        alert('Teks berhasil disalin!');
      }
    }
  </script>
</body>
</html>
